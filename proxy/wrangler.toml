name = "cinephile-proxy"
main = "src/index.ts"
compatibility_date = "2024-05-01"
# Fill this before deploying your own proxy, or set CLOUDFLARE_ACCOUNT_ID in the environment.
# account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"

# Free tier: 100,000 requests/day, plenty for a hobby project
# KV namespaces for caching and rate limiting
[[kv_namespaces]]
binding = "TMDB_CACHE"
id = "YOUR_TMDB_CACHE_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "YOUR_RATE_LIMIT_KV_NAMESPACE_ID"

# Optional: Analytics Engine for request metrics.
# Disabled by default because not every Cloudflare account has Analytics Engine enabled.
# The worker code treats env.ANALYTICS as optional.
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "cinephile_proxy"

[vars]
# Do NOT put your real key here — use `wrangler secret put TMDB_API_KEY`.
# TMDB_API_KEY = "PLACEHOLDER"
